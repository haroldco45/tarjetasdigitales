<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital - Plantilla Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2d5a27;
            --bg-gray: #f0f2f5;
            --text-dark: #1c1e21;
            --text-gray: #65676b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .card-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Cabecera */
        .header { position: relative; text-align: center; }
        .cover-photo { width: 100%; height: 200px; object-fit: cover; background: #ccc; }
        .profile-logo { 
            width: 120px; height: 120px; background: white; border-radius: 50%; 
            border: 4px solid white; position: absolute; bottom: -60px; left: 50%; 
            transform: translateX(-50%); box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        .business-info { margin-top: 70px; text-align: center; padding: 0 20px; }
        .business-info h1 { font-size: 24px; margin-bottom: 5px; color: var(--text-dark); }
        .phone-number { color: var(--text-gray); font-size: 18px; margin-bottom: 20px; }

        /* Botones de Acción */
        .action-buttons {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            padding: 20px; border-bottom: 8px solid var(--bg-gray);
        }

        .btn-item {
            display: flex; flex-direction: column; align-items: center; 
            text-decoration: none; color: var(--text-dark); font-size: 14px;
            background: none; border: none; cursor: pointer; padding: 0;
        }

        .btn-icon {
            width: 50px; height: 50px; border: 1px solid #e4e6eb; border-radius: 12px; 
            display: flex; justify-content: center; align-items: center; 
            margin-bottom: 8px; color: var(--primary-color); font-size: 20px;
        }

        /* Catálogo */
        .section { padding: 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .catalog-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #eee; }

        /* Lista de Info */
        .info-list { list-style: none; padding: 0; margin: 0; }
        .info-item {
            display: flex; padding: 15px 20px; border-bottom: 1px solid #eee; 
            align-items: center; text-decoration: none; color: var(--text-dark);
        }
        .info-item i { width: 30px; color: var(--text-gray); font-size: 18px; }
        .status-open { color: #25d366; font-weight: bold; }

        /* Footer Créditos */
        .footer-credits {
            margin-top: auto;
            padding: 30px 20px;
            text-align: center;
            background-color: var(--bg-gray);
            font-size: 13px;
            color: var(--text-gray);
            line-height: 1.6;
        }
        .footer-credits b { color: var(--text-dark); }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <img src="https://via.placeholder.com/800x400" alt="Portada" class="cover-photo">
        <img src="https://via.placeholder.com/150" alt="Logo" class="profile-logo">
    </div>

    <div class="business-info">
        <h1>[Nombre de la Empresa]</h1>
        <div class="phone-number">[Celular de Contacto]</div>
    </div>

    <div class="action-buttons">
        <a href="tel:+573243997959" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-phone"></i></div>
            Llamar
        </a>
        <a href="https://wa.me/c/573243997959" target="_blank" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-book"></i></div>
            Catálogo
        </a>
        <button onclick="compartirApp()" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-share"></i></div>
            Comp.
        </button>
        <a href="https://www.google.com/maps/search/?api=1&query=Cali+Valle+del+Cauca" target="_blank" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            Buscar
        </a>
    </div>

    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin:0; font-size: 20px;">Catálogo</h2>
            <small style="color: var(--text-gray);">Ver todos ></small>
        </div>
        <div class="catalog-grid">
            <img src="https://via.placeholder.com/200" alt="Propiedad 1">
            <img src="https://via.placeholder.com/200" alt="Propiedad 2">
            <img src="https://via.placeholder.com/200" alt="Propiedad 3">
        </div>
    </div>

    <ul class="info-list">
        <li class="info-item">
            <i class="fa-regular fa-clock"></i>
            <div>
                <span class="status-open">Abierto ahora</span><br>
                <small>9:00 a.m. - 8:00 p.m.</small>
            </div>
        </li>
        <a href="https://facebook.com/TU_PAGINA" target="_blank" class="info-item">
            <i class="fa-brands fa-facebook"></i>
            <div>Seguir en Facebook</div>
        </a>
        <li class="info-item">
            <i class="fa-solid fa-location-dot"></i>
            <div>Ubicación, Ciudad, País</div>
        </li>
    </ul>

    <footer class="footer-credits">
        App desarrollada por <b>Vibras Positivas</b><br>
        Derechos de autor &copy; 2026<br>
        Contacto: <a href="https://wa.me/573117700431" style="color: inherit; text-decoration: none;">311 770 0431</a>
    </footer>
</div>

<script>
    function compartirApp() {
        if (navigator.share) {
            navigator.share({
                title: 'Tarjeta Digital Profesional',
                text: 'Te comparto el contacto de mi empresa. ¡Mira nuestro catálogo!',
                url: window.location.href
            }).catch(console.error);
        } else {
            alert("Copia este enlace para compartir: " + window.location.href);
        }
    }
</script>

</body>
</html>
