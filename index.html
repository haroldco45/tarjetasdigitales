<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital - Fincas Cali</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2d5a27;
            --bg-gray: #f0f2f5;
            --text-dark: #1c1e21;
            --text-gray: #65676b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .card-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Cabecera */
        .header {
            position: relative;
            text-align: center;
        }

        .cover-photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .profile-logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            border: 4px solid white;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .business-info {
            margin-top: 70px;
            text-align: center;
            padding: 0 20px;
        }

        .business-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        .phone-number {
            color: var(--text-gray);
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Botones de Acción */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            border-bottom: 8px solid var(--bg-gray);
        }

        .btn-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 14px;
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            border: 1px solid #e4e6eb;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            color: var(--primary-green);
            font-size: 20px;
        }

        /* Catálogo Grid */
        .section {
            padding: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h2 { font-size: 20px; margin: 0; }
        .view-all { color: var(--text-gray); text-decoration: none; font-size: 16px; }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .catalog-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Detalles de Empresa */
        .info-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            border-top: 8px solid var(--bg-gray);
        }

        .info-item {
            display: flex;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
        }

        .info-item i {
            width: 30px;
            color: var(--text-gray);
            font-size: 18px;
        }

        .status-open { color: #25d366; font-weight: bold; }

    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80" alt="Portada" class="cover-photo">
        <img src="https://via.placeholder.com/150" alt="Logo" class="profile-logo"> </div>

    <div class="business-info">
        <h1>Alquiler de Fincas Cali</h1>
        <div class="phone-number">+57 324 3997959</div>
    </div>

    <div class="action-buttons">
        <a href="tel:+573243997959" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-phone"></i></div>
            Llamar
        </a>
        <a href="#" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-book"></i></div>
            Catálogo
        </a>
        <a href="#" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-share"></i></div>
            Comp.
        </a>
        <a href="#" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            Buscar
        </a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Catálogo</h2>
            <a href="#" class="view-all">Ver todos ></a>
        </div>
        <div class="catalog-grid">
            <img src="https://images.unsplash.com/photo-1540339832862-47452993c66b?w=200" alt="Piscina">
            <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=200" alt="Casa">
            <img src="https://images.unsplash.com/photo-1582268611958-ebfd161ef9cf?w=200" alt="Vista">
            <img src="https://images.unsplash.com/photo-1600585154340-be6191ec95b1?w=200" alt="Interior">
            <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=200" alt="Jardin">
            <img src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=200" alt="Piscina2">
        </div>
    </div>

    <ul class="info-list">
        <li class="info-item">
            <i class="fa-regular fa-clock"></i>
            <div>
                <span class="status-open">Abierto ahora</span><br>
                <small>9:00 a.m. - 8:00 p.m.</small>
            </div>
        </li>
        <a href="https://facebook.com" class="info-item">
            <i class="fa-brands fa-facebook"></i>
            <div>
                Fincas Cali<br>
                <small>Facebook • 548 me gusta</small>
            </div>
        </a>
        <a href="https://instagram.com" class="info-item">
            <i class="fa-brands fa-instagram"></i>
            <div>
                @fincascali1<br>
                <small>Instagram • 1.852 seguidores</small>
            </div>
        </a>
        <li class="info-item">
            <i class="fa-solid fa-location-dot"></i>
            <div>Cali, Valle del Cauca, Colombia</div>
        </li>
    </ul>
</div>

</body>
</html>
