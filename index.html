<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital - Editor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2d5a27;
            --bg-gray: #f0f2f5;
            --text-dark: #1c1e21;
            --text-gray: #65676b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        /* Indicador de Modo Edición */
        .edit-mode [contenteditable="true"] {
            outline: 2px dashed #3498db;
            background-color: rgba(52, 152, 219, 0.05);
            min-height: 1.2em;
        }

        .card-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Cabecera */
        .header { position: relative; text-align: center; }
        .cover-photo { width: 100%; height: 200px; object-fit: cover; background: #ddd; }
        .profile-logo { 
            width: 120px; height: 120px; background: white; border-radius: 50%; 
            border: 4px solid white; position: absolute; bottom: -60px; left: 50%; 
            transform: translateX(-50%); box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        /* Info Empresa */
        .business-info { margin-top: 70px; text-align: center; padding: 0 20px; }
        .business-info h1 { font-size: 24px; margin-bottom: 5px; color: var(--text-dark); }
        .phone-number { color: var(--text-gray); font-size: 18px; margin-bottom: 20px; }

        /* Botones de Acción */
        .action-buttons {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            padding: 20px; border-bottom: 8px solid var(--bg-gray);
        }

        .btn-item {
            display: flex; flex-direction: column; align-items: center; 
            text-decoration: none; color: var(--text-dark); font-size: 14px;
            background: none; border: none; cursor: pointer;
        }

        .btn-icon {
            width: 50px; height: 50px; border: 1px solid #e4e6eb; border-radius: 12px; 
            display: flex; justify-content: center; align-items: center; 
            margin-bottom: 8px; color: var(--primary-green); font-size: 20px;
        }

        /* Catálogo */
        .section { padding: 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .catalog-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #eee; }

        /* Detalles */
        .info-list { list-style: none; padding: 0; margin: 0; }
        .info-item {
            display: flex; padding: 15px 20px; border-bottom: 1px solid #eee; 
            align-items: center; text-decoration: none; color: var(--text-dark);
        }
        .info-item i { width: 30px; color: var(--text-gray); font-size: 18px; }

        /* Footer Créditos */
        .footer-credits {
            margin-top: auto;
            padding: 30px 20px;
            text-align: center;
            background-color: var(--bg-gray);
            font-size: 12px;
            color: var(--text-gray);
        }

        /* Botón Flotante para el dueño */
        #edit-toggle {
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--primary-green); color: white;
            border: none; border-radius: 50%; width: 60px; height: 60px;
            font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body class="edit-mode">

<button id="edit-toggle" title="Guardar cambios"><i class="fa-solid fa-save"></i></button>

<div class="card-container">
    <div class="header">
        <img src="https://via.placeholder.com/800x400" alt="Portada" class="cover-photo">
        <img src="https://via.placeholder.com/150" alt="Logo" class="profile-logo">
    </div>

    <div class="business-info">
        <h1 contenteditable="true" id="companyName">Nombre de tu Empresa</h1>
        <div class="phone-number" contenteditable="true" id="companyPhone">+57 000 0000000</div>
    </div>

    <div class="action-buttons">
        <a href="tel:3243997959" id="callBtn" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-phone"></i></div>
            Llamar
        </a>
        <a href="#" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-book"></i></div>
            Catálogo
        </a>
        <button onclick="compartir()" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-share"></i></div>
            Comp.
        </button>
        <a href="https://maps.google.com" target="_blank" class="btn-item">
            <div class="btn-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            Buscar
        </a>
    </div>

    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 contenteditable="true">Catálogo</h2>
            <a href="#" class="view-all">Ver todos ></a>
        </div>
        <div class="catalog-grid" id="catalog">
            <img src="https://via.placeholder.com/200" alt="Finca 1">
            <img src="https://via.placeholder.com/200" alt="Finca 2">
            <img src="https://via.placeholder.com/200" alt="Finca 3">
        </div>
    </div>

    <ul class="info-list">
        <li class="info-item">
            <i class="fa-regular fa-clock"></i>
            <div contenteditable="true">
                <span style="color: #25d366; font-weight: bold;">Abierto ahora</span><br>
                <small>9:00 a.m. - 8:00 p.m.</small>
            </div>
        </li>
        <li class="info-item">
            <i class="fa-brands fa-facebook"></i>
            <div contenteditable="true">Síguenos en Facebook</div>
        </li>
        <li class="info-item">
            <i class="fa-solid fa-location-dot"></i>
            <div contenteditable="true">Ciudad, País</div>
        </li>
    </ul>

    <footer class="footer-credits">
        App desarrollada por <b>Vibras Positivas</b><br>
        © Derechos de autor - (311 770 0431)
    </footer>
</div>

<script>
    const saveBtn = document.getElementById('edit-toggle');
    const phoneElement = document.getElementById('companyPhone');
    const callBtn = document.getElementById('callBtn');

    // Al guardar, actualizamos el link del botón llamar automáticamente
    saveBtn.addEventListener('click', () => {
        const cleanPhone = phoneElement.innerText.replace(/\s+/g, '');
        callBtn.setAttribute('href', 'tel:' + cleanPhone);
        
        alert("¡Datos actualizados en la tarjeta! Recuerda que para que los cambios sean permanentes debes guardar este archivo HTML.");
        
        // Opcional: Desactivar modo edición para ver como queda
        document.body.classList.toggle('edit-mode');
        saveBtn.innerHTML = document.body.classList.contains('edit-mode') ? 
            '<i class="fa-solid fa-save"></i>' : '<i class="fa-solid fa-pencil"></i>';
    });

    // Función compartir real
    function compartir() {
        if (navigator.share) {
            navigator.share({
                title: document.getElementById('companyName').innerText,
                text: 'Te comparto mi tarjeta digital profesional.',
                url: window.location.href
            }).catch(console.error);
        } else {
            alert("Enlace copiado al portapapeles");
        }
    }
</script>

</body>
</html>
